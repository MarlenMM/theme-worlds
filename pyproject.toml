# Tool configuration only. This repository is a notebook plus the scripts and
# tests around it, not an installable package.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"
# The notebook is the submitted artifact, kept as it ran on Colab rather than
# reformatted after the fact. Its code is exercised by tests/ instead.
extend-exclude = ["notebook"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
